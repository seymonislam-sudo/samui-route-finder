<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Samui Route Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: departure-board header, then one column of option cards; each card's editor hides in a collapsible panel */
:root{
  --bg:#EDF3F4; --surface:#FFFFFF; --ink:#10252C; --muted:#566C73; --line:#D2DFE2; --chip:#E1EBED;
  --accent:#0B6B75; --accent-ink:#FFFFFF; --sun:#B87612; --sun-soft:#FBEED3; --bad:#B23A3A; --board:#0F2128; --board-ink:#F2C14E;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B161A; --surface:#12222A; --ink:#E3EDEF; --muted:#8EA5AC; --line:#233840; --chip:#1A2F37;
  --accent:#43B5C0; --accent-ink:#04181B; --sun:#EAB24E; --sun-soft:#3A2D12; --bad:#E57A7A; --board:#060E11; --board-ink:#F2C14E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B161A; --surface:#12222A; --ink:#E3EDEF; --muted:#8EA5AC; --line:#233840; --chip:#1A2F37;
  --accent:#43B5C0; --accent-ink:#04181B; --sun:#EAB24E; --sun-soft:#3A2D12; --bad:#E57A7A; --board:#060E11; --board-ink:#F2C14E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
header.top{background:var(--board)}
header.top .wrap{padding-block:20px 16px;display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,46px);letter-spacing:.02em;line-height:1;margin:0;text-transform:uppercase;color:var(--board-ink)}
.board{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:#9FB6BC;text-transform:uppercase}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:flex;gap:6px;flex-wrap:wrap}
button{font:600 13.5px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;cursor:pointer}
.seg button{font-weight:500;padding:6px 11px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.link{background:none;border:0;color:var(--accent);padding:6px 0}
button.x{background:none;border:0;color:var(--muted);padding:6px;font-size:18px;line-height:1}
button.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.trav{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.trav input{width:64px;text-align:center}
input,select{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 8px;width:100%;min-width:0}
.note{background:var(--sun-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.opt.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sum{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:start}
.eyebrow{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 6px;letter-spacing:.04em}
.name{font-size:18px;font-weight:600;margin:2px 0 0;text-wrap:balance}
.route{font:500 13px var(--mono);color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.total{text-align:right}
.total b{font:600 22px var(--mono);font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.total small{color:var(--muted);font-size:12.5px}
.facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin-top:6px}
.facts b{color:var(--ink);font-weight:600}
details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:11px 16px;font-weight:600;font-size:14px;color:var(--accent);display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:500 18px var(--mono);line-height:1}
details[open] summary::after{content:"–"}
.panel{padding:4px 16px 16px;display:flex;flex-direction:column;gap:16px}
.panel h3{margin:0;font:600 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.rows{display:flex;flex-direction:column;gap:8px}
.r{display:grid;gap:6px;align-items:end;padding:8px;border:1px solid var(--line);border-radius:9px}
.r.leg{grid-template-columns:1.3fr .8fr .8fr 1.4fr .9fr auto}
.r.hotel{grid-template-columns:1.6fr .7fr .7fr .9fr auto}
.r .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}
@media (max-width:560px){
  .r.leg{grid-template-columns:1fr 1fr 1fr}
  .r.leg .w2{grid-column:span 2}
  .r.hotel{grid-template-columns:1fr 1fr 1fr}
  .r.hotel .w3{grid-column:1/-1}
}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:90px;font:12px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px}
.foot summary{color:var(--muted);padding-inline:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:9px;padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:20;font-size:14px}
.toast button{background:none;border:1px solid currentColor;color:inherit;padding:4px 10px}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <h1>Samui Route Finder</h1>
  <div class="board">London → Koh Samui · Summer 2027</div>
</div></header>
<main class="wrap" id="app"></main>
<div id="toast" class="toast" hidden></div>

<script>
const KEY='samui-simple-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp=n=>'£'+Math.round(n).toLocaleString('en-GB');
const leg=(date,from,to,carrier,price,mode='flight')=>({id:uid(),date,from,to,carrier,price,mode});
const hotel=(place,nights,rooms,rate)=>({id:uid(),place,nights,rooms,rate});

function seed(){return{travellers:6,sort:'cheap',example:true,options:[
  {id:uid(),name:'Direct to Samui (one ticket)',dates:'23 Jul – 9 Aug',legs:[
    leg('2027-07-23','LHR','USM','Thai + Bangkok Airways, 1 stop',620),leg('2027-08-08','USM','LHR','Bangkok Airways + Thai, 1 stop',620)],hotels:[]},
  {id:uid(),name:'Bangkok overnight, fly to Samui next day',dates:'23 Jul – 9 Aug',legs:[
    leg('2027-07-23','LHR','BKK','EVA Air',430),leg('2027-07-25','BKK','USM','Bangkok Airways',165),
    leg('2027-08-08','USM','BKK','Bangkok Airways',160),leg('2027-08-09','BKK','LHR','EVA Air',430)],
    hotels:[hotel('Bangkok airport hotel',1,3,85)]},
  {id:uid(),name:'Bangkok, then Surat Thani and ferry',dates:'23 Jul – 9 Aug',legs:[
    leg('2027-07-23','LHR','BKK','EVA Air',430),leg('2027-07-25','BKK','URT','Thai AirAsia',48),leg('2027-07-25','URT','Samui','Lomprayah coach + ferry',22,'ferry'),
    leg('2027-08-08','Samui','URT','Lomprayah ferry + coach',22,'ferry'),leg('2027-08-08','URT','BKK','Thai AirAsia',45),leg('2027-08-09','BKK','LHR','EVA Air',430)],
    hotels:[hotel('Bangkok airport hotel',1,3,85)]},
  {id:uid(),name:'Via Singapore',dates:'23 Jul – 9 Aug',legs:[
    leg('2027-07-23','LHR','SIN','Singapore Airlines',715),leg('2027-07-25','SIN','USM','Bangkok Airways',189),
    leg('2027-08-08','USM','SIN','Bangkok Airways',185),leg('2027-08-08','SIN','LHR','Singapore Airlines',690)],
    hotels:[hotel('Singapore airport hotel',1,3,165)]}
]}}

let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.options))S=seed();
const open=new Set();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function calc(o){
  const t=Math.max(1,+S.travellers||1);
  const fares=o.legs.reduce((s,l)=>s+(+l.price||0),0)*t;
  const hotels=o.hotels.reduce((s,h)=>s+(+h.nights||0)*(+h.rooms||0)*(+h.rate||0),0);
  const flights=o.legs.filter(l=>l.mode==='flight').length,boats=o.legs.length-flights;
  const nights=o.hotels.reduce((s,h)=>s+(+h.nights||0),0);
  return{total:fares+hotels,pp:(fares+hotels)/t,fares,hotels,flights,boats,nights};
}
function route(o){
  const out=[];for(const l of o.legs){if(!out.length||out[out.length-1]!==l.from)out.push(l.from);out.push(l.to)}
  return out.filter(Boolean).map(esc).join(' → ')||'No legs yet';
}
function fd(d){if(!d)return'';const t=new Date(d+'T12:00:00Z');return t.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}

function legRow(o,l){return `<div class="r leg" data-o="${o.id}" data-l="${l.id}">
  <label class="w2">Date<input type="date" id="d-${l.id}" data-f="date" value="${esc(l.date)}"></label>
  <label>From<input id="f-${l.id}" data-f="from" value="${esc(l.from)}"></label>
  <label>To<input id="t-${l.id}" data-f="to" value="${esc(l.to)}"></label>
  <label class="w2">Airline / ferry<input id="c-${l.id}" data-f="carrier" value="${esc(l.carrier)}"></label>
  <label>£ per person<input id="p-${l.id}" data-f="price" inputmode="decimal" value="${esc(l.price)}"></label>
  <button class="x" data-act="delLeg" aria-label="Remove leg">×</button>
  <label class="sub" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="m-${l.id}" data-f="mode" ${l.mode==='ferry'?'checked':''} style="width:auto"> Ferry or coach (not a flight)</label>
</div>`}
function hotelRow(o,h){return `<div class="r hotel" data-o="${o.id}" data-h="${h.id}">
  <label class="w3">Hotel<input id="hn-${h.id}" data-f="place" value="${esc(h.place)}"></label>
  <label>Nights<input id="hg-${h.id}" data-f="nights" type="number" min="0" value="${esc(h.nights)}"></label>
  <label>Rooms<input id="hr-${h.id}" data-f="rooms" type="number" min="0" value="${esc(h.rooms)}"></label>
  <label>£ / room / night<input id="hp-${h.id}" data-f="rate" inputmode="decimal" value="${esc(h.rate)}"></label>
  <button class="x" data-act="delHotel" aria-label="Remove hotel">×</button>
</div>`}

function render(){
  const list=S.options.map((o,i)=>({o,n:i+1,c:calc(o)}));
  if(S.sort==='cheap')list.sort((a,b)=>a.c.total-b.c.total);
  if(S.sort==='flights')list.sort((a,b)=>a.c.flights-b.c.flights||a.c.total-b.c.total);
  const best=list.length?Math.min(...list.map(x=>x.c.total)):0;
  let h=`<div class="bar"><div class="seg" role="group" aria-label="Sort">${[['cheap','Cheapest'],['flights','Fewest flights'],['order','My order']].map(([k,l])=>`<button data-act="sort" data-k="${k}" aria-pressed="${S.sort===k}">${l}</button>`).join('')}</div>
   <label class="trav" style="flex-direction:row">Travellers <input id="trav" type="number" min="1" value="${S.travellers}"></label></div>`;
  if(S.example)h+=`<div class="note"><b>Example prices.</b> Open Details on each option to put in what you find on Google Flights. <button class="link" data-act="clearEx">Hide this</button></div>`;
  h+=list.map(({o,n,c})=>`<article class="opt${c.total===best&&list.length>1?' best':''}" id="o-${o.id}">
   <div class="sum">
    <div><div class="eyebrow">Option ${n}${c.total===best&&list.length>1?'<span class="tag">Cheapest</span>':''}<span>${esc(o.dates)}</span></div>
     <div class="name">${esc(o.name)}</div><div class="route" data-sum="route">${route(o)}</div></div>
    <div class="total"><b data-sum="total">${gbp(c.total)}</b><small data-sum="pp">${gbp(c.pp)} each</small></div>
    <div class="facts" data-sum="facts">${facts(c)}</div>
   </div>
   <details ${open.has(o.id)?'open':''} data-o="${o.id}"><summary>Details</summary><div class="panel">
    <div class="two"><label>Option name<input id="on-${o.id}" data-of="name" value="${esc(o.name)}"></label><label>Dates<input id="od-${o.id}" data-of="dates" value="${esc(o.dates)}"></label></div>
    <h3>Flights &amp; ferries</h3><div class="rows">${o.legs.map(l=>legRow(o,l)).join('')}</div>
    <div><button data-act="addLeg" data-o="${o.id}">+ Add flight or ferry</button></div>
    <h3>Hotels</h3><div class="rows">${o.hotels.map(x=>hotelRow(o,x)).join('')||'<span style="color:var(--muted);font-size:13px">No stopover hotels.</span>'}</div>
    <div><button data-act="addHotel" data-o="${o.id}">+ Add hotel</button></div>
    <div class="tools"><button data-act="dup" data-o="${o.id}">Copy option (e.g. for other dates)</button><button class="danger" data-act="delOpt" data-o="${o.id}">Delete option</button></div>
   </div></details></article>`).join('');
  h+=`<div><button class="primary" data-act="addOpt">+ Add option</button></div>
   <details class="foot"><summary>Back up or move your data</summary><div style="display:flex;flex-direction:column;gap:8px">
    <p style="margin:0;font-size:13px;color:var(--muted)">Prices are saved in this browser only. Copy them to move to another device.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button data-act="export">Copy data</button><button data-act="import">Load pasted data</button><button class="danger" data-act="reset">Reset to examples</button></div>
    <textarea id="io" placeholder="Paste copied data here"></textarea></div></details>`;
  document.getElementById('app').innerHTML=h;
}
function facts(c){return `<span><b>${c.flights}</b> flight${c.flights===1?'':'s'}${c.boats?` + <b>${c.boats}</b> ferry`:''}</span>${c.nights?`<span><b>${c.nights}</b> hotel night${c.nights>1?'s':''} · ${gbp(c.hotels)}</span>`:''}<span>Fares ${gbp(c.fares)}</span>`}
function refresh(o){
  const card=document.getElementById('o-'+o.id);if(!card)return;const c=calc(o);
  card.querySelector('[data-sum=total]').textContent=gbp(c.total);
  card.querySelector('[data-sum=pp]').textContent=gbp(c.pp)+' each';
  card.querySelector('[data-sum=facts]').innerHTML=facts(c);
  card.querySelector('[data-sum=route]').innerHTML=route(o);
}
function toast(msg,undoFn){const el=document.getElementById('toast');el.innerHTML=`<span>${msg}</span>${undoFn?'<button id="undo">Undo</button>':''}`;el.hidden=false;
  if(undoFn)document.getElementById('undo').onclick=()=>{undoFn();el.hidden=true;save();render()};clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,5000)}
const find=id=>S.options.find(o=>o.id===id);

document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-o]')){d.open?open.add(d.dataset.o):open.delete(d.dataset.o)}},true);
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='trav'){S.travellers=Math.max(1,+el.value||1);S.options.forEach(refresh);save();return}
  const card=el.closest('.opt');if(!card)return;const o=find(card.id.slice(2));
  if(el.dataset.of){o[el.dataset.of]=el.value;if(el.dataset.of==='name')card.querySelector('.name').textContent=el.value}
  const lr=el.closest('[data-l]'),hr=el.closest('[data-h]');
  if(lr){const l=o.legs.find(x=>x.id===lr.dataset.l);const f=el.dataset.f;l[f]=f==='mode'?(el.checked?'ferry':'flight'):f==='price'?el.value.replace(/[£,\s]/g,''):f==='from'||f==='to'?el.value.toUpperCase().length<=4?el.value.toUpperCase():el.value:el.value}
  if(hr){const x=o.hotels.find(y=>y.id===hr.dataset.h);x[el.dataset.f]=el.dataset.f==='place'?el.value:el.value.replace(/[£,\s]/g,'')}
  refresh(o);save();
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  const o=find(b.dataset.o||b.closest('[data-o]')?.dataset.o);
  if(a==='sort')S.sort=b.dataset.k;
  else if(a==='clearEx')S.example=false;
  else if(a==='addLeg'){const last=o.legs[o.legs.length-1];o.legs.push(leg(last?.date||'',last?.to||'','','',0))}
  else if(a==='delLeg'){const id=b.closest('[data-l]').dataset.l;const i=o.legs.findIndex(x=>x.id===id);const[r]=o.legs.splice(i,1);toast('Leg removed',()=>o.legs.splice(i,0,r))}
  else if(a==='addHotel')o.hotels.push(hotel('',1,Math.ceil((+S.travellers||2)/2),0));
  else if(a==='delHotel'){const id=b.closest('[data-h]').dataset.h;const i=o.hotels.findIndex(x=>x.id===id);const[r]=o.hotels.splice(i,1);toast('Hotel removed',()=>o.hotels.splice(i,0,r))}
  else if(a==='dup'){const c=JSON.parse(JSON.stringify(o));c.id=uid();c.name=o.name+' (copy)';c.legs.forEach(l=>l.id=uid());c.hotels.forEach(h=>h.id=uid());S.options.splice(S.options.indexOf(o)+1,0,c);open.add(c.id);toast('Option copied. Change its dates and prices.')}
  else if(a==='delOpt'){const i=S.options.indexOf(o);S.options.splice(i,1);toast('Option deleted',()=>S.options.splice(i,0,o))}
  else if(a==='addOpt'){const n={id:uid(),name:'New option',dates:'',legs:[leg('','LHR','','',0)],hotels:[]};S.options.push(n);open.add(n.id)}
  else if(a==='export'){const t=JSON.stringify(S),io=document.getElementById('io');try{await navigator.clipboard.writeText(t);toast('Data copied')}catch(err){io.value=t;io.select();toast('Copy the selected text')}return}
  else if(a==='import'){try{const d=JSON.parse(document.getElementById('io').value);if(!Array.isArray(d.options))throw 0;S=d;toast('Data loaded')}catch(err){toast('That text isn\'t data copied from this page.');return}}
  else if(a==='reset'){const old=S;S=seed();toast('Reset to examples',()=>S=old)}
  else return;
  const y=window.scrollY;save();render();window.scrollTo(0,y);
});
render();
</script>
</body>
</html>
